[project]
name = "probabilistic-energy-modeling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "otii-tcp-client>=1.0.11",
    "pandas>=2.3.3",
    "scipy>=1.16.2",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
]

[project.scripts]
pem = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "scripts/pipeline",
    "scripts/measurement",
    "scripts/benchmarks",
    "scripts/reports",
    "scripts/analysis",
]
# Editable installs put scripts/ itself on sys.path, so `pem` always runs the
# working tree and type checkers resolve the same files.
dev-mode-dirs = ["scripts"]

[tool.ruff]
src = ["scripts"]
# Python snippets inside documentation are fragments, not statements, and ruff
# rewrites keyword arguments into assignments when it formats them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
ignore = [
    # Plotting and measurement helpers deliberately swallow any backend or
    # device failure and fall back to a default.
    "BLE001",
    # Report timestamps are local wall-clock time on purpose.
    "DTZ005",
]
